name: Publish Release to APT Repo
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (leave blank for latest)'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install APT Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Import GPG Signing Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --keyid-format=long | grep sec | awk '{print $2}' | cut -d'/' -f2)
          echo "GPG_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"

      - name: Resolve Release Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          TAG="${{ github.event.inputs.tag }}"

          if [ -z "$TAG" ]; then
            TAG=$(curl -sH "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/latest" \
              | jq -r '.tag_name')
          fi

          echo "Resolved tag: $TAG"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Download Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site/debs/pool
          REPO="${{ github.repository }}"

          echo "Processing assets for release: $RELEASE_TAG"

          curl -sH "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/$RELEASE_TAG" \
            | jq -r '.assets[] | select(.name | endswith(".deb")) | "\(.name) \(.browser_download_url)"' > download_map.txt

          while read -r filename url; do
            [ -z "$filename" ] && continue
            echo "Downloading: $filename"
            curl -sL "$url" -o "site/debs/pool/$filename"
          done < download_map.txt
          rm -f download_map.txt
          
      - name: Build Meta-Packages
        run: |
          sudo apt-get install -y equivs

          # --- Resolve desktop packages ---
          DESKTOP_IMAGE=$(ls site/debs/pool/linux-image-*-lazy_*.deb 2>/dev/null | grep -v lazyserver | grep -v lazy-meta | head -1 | xargs -r basename | sed 's/_.*//')
          DESKTOP_HEADERS=$(ls site/debs/pool/linux-headers-*-lazy_*.deb 2>/dev/null | grep -v lazyserver | head -1 | xargs -r basename | sed 's/_.*//')

          # --- Resolve server packages ---
          SERVER_IMAGE=$(ls site/debs/pool/linux-image-*-lazyserver_*.deb 2>/dev/null | head -1 | xargs -r basename | sed 's/_.*//')
          SERVER_HEADERS=$(ls site/debs/pool/linux-headers-*-lazyserver_*.deb 2>/dev/null | head -1 | xargs -r basename | sed 's/_.*//')

          echo "Desktop: $DESKTOP_IMAGE, $DESKTOP_HEADERS"
          echo "Server:  $SERVER_IMAGE, $SERVER_HEADERS"

          build_meta () {
            local NAME="$1"          # e.g. linux-image-lazy-desktop-meta
            local DEPENDS="$2"       # e.g. "linux-image-6.18.40-lazy, linux-headers-6.18.40-lazy"
            local CONFLICTS="$3"     # e.g. linux-image-lazy-server-meta
            local POSTINST_PATTERN="$4"  # awk regex to match this variant's image packages
            local DESC="$5"

            cat > "${NAME}.control" << EOF
          Package: ${NAME}
          Version: ${RELEASE_TAG}
          Architecture: amd64
          Depends: ${DEPENDS}
          Conflicts: ${CONFLICTS}
          Maintainer: dozingyobs
          Description: ${DESC}
           Installing this package ensures apt upgrade always pulls the
           latest matching LazyKernel image and headers.
          EOF

            equivs-build "${NAME}.control"

            local DEB
            DEB=$(ls "${NAME}"_*.deb | head -1)
            rm -rf meta-extract
            dpkg-deb -R "$DEB" meta-extract

            cat > meta-extract/DEBIAN/postinst << EOF
          #!/bin/bash
          set -e
          KEEP=2
          RUNNING="\$(uname -r)"
          mapfile -t PKGS < <(dpkg -l | awk '/^ii/ && /${POSTINST_PATTERN}/ {print \$2}' | sort -V -r)
          COUNT=0
          for pkg in "\${PKGS[@]}"; do
              COUNT=\$((COUNT + 1))
              [ "\$COUNT" -le "\$KEEP" ] && continue
              [[ "\$pkg" == *"\$RUNNING"* ]] && continue
              echo "lazykernel-autoremove: marking \$pkg as auto-installed"
              apt-mark auto "\$pkg" >/dev/null 2>&1 || true
          done
          exit 0
          EOF
            chmod 755 meta-extract/DEBIAN/postinst

            dpkg-deb -b meta-extract "$DEB"
            rm -rf meta-extract
            mv "$DEB" site/debs/pool/
          }

          if [ -n "$DESKTOP_IMAGE" ]; then
            build_meta "linux-image-lazy-desktop-meta" \
                       "${DESKTOP_IMAGE}, ${DESKTOP_HEADERS}" \
                       "linux-image-lazy-server-meta" \
                       'linux-image-.*-lazy$' \
                       "Meta-package tracking the latest LazyKernel Desktop build"
          fi

          if [ -n "$SERVER_IMAGE" ]; then
            build_meta "linux-image-lazy-server-meta" \
                       "${SERVER_IMAGE}, ${SERVER_HEADERS}" \
                       "linux-image-lazy-desktop-meta" \
                       'linux-image-.*-lazyserver' \
                       "Meta-package tracking the latest LazyKernel Server build"
          fi
      - name: Verify Meta-Packages
        run: |
          for pkg in linux-image-lazy-desktop-meta linux-image-lazy-server-meta; do
            DEB=$(ls site/debs/pool/${pkg}_*.deb 2>/dev/null | head -1)
            if [ -z "$DEB" ]; then
              echo "::warning::$pkg not found, skipping (may not have been built this run)"
              continue
            fi
            dpkg-deb -e "$DEB" /tmp/check-$pkg
            if [ ! -x "/tmp/check-$pkg/postinst" ]; then
              echo "::error::postinst missing or not executable in $pkg!"
              exit 1
            fi
            echo "$pkg verified ✓"
          done

      - name: Generate Package Index
        run: |
          cd site/debs
          rm -f Packages Packages.gz Release Release.gpg InRelease
          dpkg-scanpackages pool /dev/null > Packages
          gzip -k -f Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin="kernel-actions" \
                         -o APT::FTPArchive::Release::Label="kernel-actions" \
                         -o APT::FTPArchive::Release::Suite="stable" \
                         -o APT::FTPArchive::Release::Codename="kernel-actions" \
                         release . > Release
          cd ../..

      - name: Sign the Repository
        run: |
          cd site/debs
          gpg --batch --yes --default-key "$GPG_KEY_ID" -abs -o Release.gpg Release
          gpg --batch --yes --default-key "$GPG_KEY_ID" --clearsign -o InRelease Release
          cd ../..

      - name: Copy public key into site
        run: cp pubkey.gpg site/pubkey.gpg

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build-repo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
