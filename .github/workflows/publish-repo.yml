name: Publish Release to APT Repo
on:
  workflow_dispatch:
    inputs:
      stable_tag:
        description: 'Desktop stable release tag to publish (leave blank to auto-find latest)'
        required: false
      longterm_tag:
        description: 'Desktop longterm release tag to publish (leave blank to auto-find latest)'
        required: false
      server_tag:
        description: 'Server release tag to publish (leave blank to auto-find latest)'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install APT Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg equivs

      - name: Import GPG Signing Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --keyid-format=long | grep sec | awk '{print $2}' | cut -d'/' -f2)
          echo "GPG_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"

      - name: Resolve Release Tags
        id: resolve-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"

          # Desktop kernel builds are tagged v<version>-<moniker>-debug (see Build Kernel workflow).
          find_latest_by_tag_suffix () {
            local SUFFIX="$1"   # e.g. "-stable-debug"
            curl -sH "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/releases?per_page=30" \
              | jq -r --arg suf "$SUFFIX" '
                  [.[] | select(.tag_name | endswith($suf))] | .[0].tag_name // empty
                '
          }

          # Server builds carry no moniker (single-track) — match by asset name instead.
          find_latest_by_asset_pattern () {
            local PATTERN="$1"
            curl -sH "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/releases?per_page=30" \
              | jq -r --arg pat "$PATTERN" '
                  [.[] | select(.assets[]?.name | test($pat))] | .[0].tag_name // empty
                '
          }

          STABLE_TAG="${{ github.event.inputs.stable_tag }}"
          [ -z "$STABLE_TAG" ] && STABLE_TAG=$(find_latest_by_tag_suffix '-stable-debug')

          LONGTERM_TAG="${{ github.event.inputs.longterm_tag }}"
          [ -z "$LONGTERM_TAG" ] && LONGTERM_TAG=$(find_latest_by_tag_suffix '-longterm-debug')

          SERVER_TAG="${{ github.event.inputs.server_tag }}"
          [ -z "$SERVER_TAG" ] && SERVER_TAG=$(find_latest_by_asset_pattern '-lazyserver')

          echo "Resolved stable tag:   ${STABLE_TAG:-none found}"
          echo "Resolved longterm tag: ${LONGTERM_TAG:-none found}"
          echo "Resolved server tag:   ${SERVER_TAG:-none found}"

          echo "stable_tag=$STABLE_TAG"     >> "$GITHUB_OUTPUT"
          echo "longterm_tag=$LONGTERM_TAG" >> "$GITHUB_OUTPUT"
          echo "server_tag=$SERVER_TAG"     >> "$GITHUB_OUTPUT"

      - name: Restore Existing Pools
        continue-on-error: true
        run: |
          BASE_URL="https://${{ github.repository_owner }}.github.io/$(basename ${{ github.repository }})"
          for TRACK in stable longterm server; do
            mkdir -p "site/$TRACK/pool"
            PACKAGES_URL="$BASE_URL/$TRACK/Packages"
            echo "Checking for existing package index: $PACKAGES_URL"
            if ! curl -sf "$PACKAGES_URL" -o "/tmp/existing-Packages-$TRACK"; then
              echo "No existing Packages for $TRACK (likely first run) — starting fresh."
              continue
            fi
            grep '^Filename:' "/tmp/existing-Packages-$TRACK" | awk '{print $2}' | while read -r relpath; do
              fname=$(basename "$relpath")
              dest="site/$TRACK/pool/$fname"
              [ -f "$dest" ] && continue
              echo "Restoring: $fname ($TRACK)"
              curl -sf "$BASE_URL/$TRACK/$relpath" -o "$dest" || echo "::warning::Failed to restore $fname ($TRACK)"
            done
          done

      - name: Download Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"

          download_track () {
            local TRACK="$1"
            local TAG="$2"
            [ -z "$TAG" ] && { echo "No tag resolved for $TRACK, skipping download."; return 0; }
            mkdir -p "site/$TRACK/pool"
            echo "Processing assets for $TRACK from release: $TAG"

            curl -sH "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/tags/$TAG" \
              | jq -r '.assets[] | select(.name | endswith(".deb")) | "\(.name) \(.browser_download_url)"' > download_map.txt

            while read -r filename url; do
              [ -z "$filename" ] && continue
              echo "Downloading: $filename -> $TRACK"
              curl -sL "$url" -o "site/$TRACK/pool/$filename"
            done < download_map.txt
            rm -f download_map.txt
          }

          download_track "stable"   "${{ steps.resolve-tags.outputs.stable_tag }}"
          download_track "longterm" "${{ steps.resolve-tags.outputs.longterm_tag }}"
          download_track "server"   "${{ steps.resolve-tags.outputs.server_tag }}"

      - name: Build Meta-Packages
        run: |
          build_meta () {
            local TRACK="$1"           # e.g. stable
            local NAME="$2"            # e.g. linux-image-lazy-stable-meta
            local IMAGE_GLOB="$3"      # e.g. 'linux-image-*-lazy_*.deb'
            local HEADERS_GLOB="$4"    # e.g. 'linux-headers-*-lazy_*.deb'
            local POSTINST_PATTERN="$5"
            local DESC="$6"

            local IMAGE_DEB HEADERS_DEB IMAGE HEADERS VERSION
            IMAGE_DEB=$(ls site/$TRACK/pool/$IMAGE_GLOB 2>/dev/null | grep -v -- '-meta' | head -1)
            HEADERS_DEB=$(ls site/$TRACK/pool/$HEADERS_GLOB 2>/dev/null | head -1)

            if [ -z "$IMAGE_DEB" ]; then
              echo "::warning::No image package found for $TRACK, skipping meta-package"
              return 0
            fi

            IMAGE=$(basename "$IMAGE_DEB" | sed 's/_.*//')
            HEADERS=$(basename "$HEADERS_DEB" 2>/dev/null | sed 's/_.*//')
            # Derive version from the actual image package's control version field,
            # rather than an undefined RELEASE_TAG (previous script referenced this
            # but never set it, producing an empty Version field).
            VERSION=$(dpkg-deb -f "$IMAGE_DEB" Version)

            echo "$TRACK meta: image=$IMAGE headers=$HEADERS version=$VERSION"

            cat > "${NAME}.control" << EOF
          Package: ${NAME}
          Version: ${VERSION}
          Architecture: amd64
          Depends: ${IMAGE}${HEADERS:+, ${HEADERS}}
          Maintainer: dozingyobs
          Description: ${DESC}
           Installing this package ensures apt upgrade always pulls the
           latest matching LazyKernel image and headers for this track.
          EOF

            equivs-build "${NAME}.control"

            local DEB
            DEB=$(ls "${NAME}"_*.deb | head -1)
            rm -rf meta-extract
            dpkg-deb -R "$DEB" meta-extract

            cat > meta-extract/DEBIAN/postinst << EOF
          #!/bin/bash
          set -e
          KEEP=2
          RUNNING="\$(uname -r)"
          mapfile -t PKGS < <(dpkg -l | awk '/^ii/ && /${POSTINST_PATTERN}/ {print \$2}' | sort -V -r)
          COUNT=0
          for pkg in "\${PKGS[@]}"; do
              COUNT=\$((COUNT + 1))
              [ "\$COUNT" -le "\$KEEP" ] && continue
              [[ "\$pkg" == *"\$RUNNING"* ]] && continue
              echo "lazykernel-autoremove: marking \$pkg as auto-installed"
              apt-mark auto "\$pkg" >/dev/null 2>&1 || true
          done
          exit 0
          EOF
            chmod 755 meta-extract/DEBIAN/postinst

            dpkg-deb -b meta-extract "$DEB"
            rm -rf meta-extract
            mv "$DEB" "site/$TRACK/pool/"
          }

          build_meta "stable"   "linux-image-lazy-stable-meta"   \
                     'linux-image-*-lazy_*.deb' 'linux-headers-*-lazy_*.deb' \
                     'linux-image-.*-lazy$' \
                     "Meta-package tracking the latest LazyKernel Desktop (stable) build"

          build_meta "longterm" "linux-image-lazy-longterm-meta" \
                     'linux-image-*-lazy_*.deb' 'linux-headers-*-lazy_*.deb' \
                     'linux-image-.*-lazy$' \
                     "Meta-package tracking the latest LazyKernel Desktop (longterm) build"

          build_meta "server"   "linux-image-lazy-server-meta"   \
                     'linux-image-*-lazyserver_*.deb' 'linux-headers-*-lazyserver_*.deb' \
                     'linux-image-.*-lazyserver' \
                     "Meta-package tracking the latest LazyKernel Server build"

      - name: Verify Meta-Packages
        run: |
          for entry in "stable:linux-image-lazy-stable-meta" "longterm:linux-image-lazy-longterm-meta" "server:linux-image-lazy-server-meta"; do
            TRACK="${entry%%:*}"
            pkg="${entry##*:}"
            DEB=$(ls site/$TRACK/pool/${pkg}_*.deb 2>/dev/null | head -1)
            if [ -z "$DEB" ]; then
              echo "::warning::$pkg not found in $TRACK, skipping (may not have been built this run)"
              continue
            fi
            dpkg-deb -e "$DEB" /tmp/check-$pkg
            if [ ! -x "/tmp/check-$pkg/postinst" ]; then
              echo "::error::postinst missing or not executable in $pkg!"
              exit 1
            fi
            echo "$pkg verified ✓"
          done

      - name: Generate Package Indexes
        run: |
          for TRACK in stable longterm server; do
            [ -d "site/$TRACK/pool" ] || continue
            cd "site/$TRACK"
            rm -f Packages Packages.gz Release Release.gpg InRelease
            dpkg-scanpackages pool /dev/null > Packages
            gzip -k -f Packages
            apt-ftparchive -o APT::FTPArchive::Release::Origin="kernel-actions" \
                           -o APT::FTPArchive::Release::Label="kernel-actions" \
                           -o APT::FTPArchive::Release::Suite="$TRACK" \
                           -o APT::FTPArchive::Release::Codename="$TRACK" \
                           release . > Release
            cd ../..
          done

      - name: Sign the Repository
        run: |
          for TRACK in stable longterm server; do
            [ -f "site/$TRACK/Release" ] || continue
            cd "site/$TRACK"
            gpg --batch --yes --default-key "$GPG_KEY_ID" -abs -o Release.gpg Release
            gpg --batch --yes --default-key "$GPG_KEY_ID" --clearsign -o InRelease Release
            cd ../..
          done

      - name: Copy public key into site
        run: cp pubkey.gpg site/pubkey.gpg

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build-repo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4